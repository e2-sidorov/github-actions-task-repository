name: My Fours Workflow

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
  workflow_dispatch: 
    inputs:
      env:
        description: Target environment
        type: choice
        options: [dev, staging]
        default: dev
      runner: 
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest]
        default: ubuntu-latest
        
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build:
    timeout-minutes: 10
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven 

      - name: Optional check
        id: optional_check
        continue-on-error: true
        run: exit 1

      - name: Print outcome and conclusion
        run: |
          echo "outcome: ${{ steps.optional_check.outcome }}"
          echo "conclusion: ${{ steps.optional_check.conclusion }}"

      - name: Run tests
        env:
          TEST_ENV: ${{ inputs.env || 'dev' }} 
        run: mvn -B test -Denv=$TEST_ENV
          
      - name: Upload artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports 
