name: My Third Workflow

on:
  workflow_dispatch:
    inputs:
      environmet:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
      should_fail:
        type: boolean
        default: false

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    runs-on: ubuntu-latest
    steps:
        - name: Setup Java
          uses: actions/setup-java@v5
          with:
            java-version: ${{ matrix.java }}
          
        - name: Print Java Version 
          run: java -version
          
        - name: Print Deploying to PROD!
          if: inputs.environmet == 'prod'
          run: echo "Deploying to PROD!"

        - name: Fail Job
          if: inputs.should_fail == 'true'
          run: exit 1

        - name: Print Tests failed collecting logs
          if: failure()
          run: echo "Tests failed, collecting logs"

  summary:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print test result
        run: echo ${{ needs.tests.result }}
